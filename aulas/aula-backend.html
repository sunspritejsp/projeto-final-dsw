<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backend do CineMais: rotas, validação e banco</title>
<style>
/* Guided lesson shell. Replace the tokens per subject; keep the hierarchy:
   progress → title → scene → one narration line + one primary action. */
:root {
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --bg:#f6f5f1;
  --surface:#fff;
  --ink:#14161b;
  --muted:#6b6f78;
  --faint:#a3a6ad;
  --line:#e6e3dc;
  --accent:#3b5bdb;
  --accent-soft:#e9edff;
  --accent-ink:#2a44b8;
  --warm:#f59f00;
  --warm-soft:#fff3d6;
  --good:#0c8a5f;
  --good-soft:#e3f6ee;
  --bad:#d9480f;
  --bad-soft:#fdebe2;
  --radius:20px;
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  font-feature-settings:'cv11','ss01';
  -webkit-font-smoothing:antialiased
}
* { box-sizing:border-box }
html,body { margin:0; height:100% }
body { background:var(--bg) }
button,input,select,textarea { font:inherit; color:inherit }
button { cursor:pointer }
button:disabled { cursor:default }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:8px }

.lp { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; max-width:1360px; margin:0 auto; padding:0 clamp(16px,3vw,44px) }
.lp-top { display:flex; align-items:center; gap:24px; height:64px }
.lp-course { margin:0; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%}
.lp-progress { flex:1; display:flex; gap:4px }
.lp-progress button { flex:1; background:none; border:0; padding:12px 0 }
.lp-progress span { display:block; height:5px; border-radius:99px; background:var(--line) }
.lp-progress .done span { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-progress [aria-current] span { background:var(--accent) }
.lp-progress button:hover span { background:var(--faint) }

.lp-stage { display:flex; flex-direction:column; min-height:0; padding-top:6px }
.lp-kicker { margin:0; font-size:13px; font-weight:650; letter-spacing:.12em; text-transform:uppercase; color:var(--accent) }
.lp-stage h1 { margin:6px 0 0; font-size:clamp(28px,3vw,42px); line-height:1.08; font-weight:720; letter-spacing:-.025em; max-width:30ch; text-wrap:balance }
.lp-scene { position:relative; flex:1; min-height:0; margin:18px 0 12px; background:var(--surface); border-radius:var(--radius); box-shadow:0 1px 2px rgba(20,22,27,.04),0 12px 40px rgba(20,22,27,.06); overflow:hidden; display:flex }
.lp-scene > * { flex:1; min-width:0 }
.lp-inputs { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 6px }
.lp-inputs[hidden] { display:none }
.lp-label { font-size:15px; font-weight:600; color:var(--muted) }
.lp-value { font:600 18px var(--mono); min-width:4ch; color:var(--ink) }
.lp-inputs input[type=range] { width:min(320px,60vw); accent-color:var(--accent) }
.lp-inputs select { padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface) }
.lp-choices { display:flex; flex-wrap:wrap; align-items:center; gap:10px }
.lp-choice { padding:11px 18px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); font-size:17px; font-weight:550 }
.lp-choice:hover { border-color:var(--faint) }
.lp-choice[aria-pressed=true] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink) }

.lp-bar { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:18px; padding:12px 0 18px; border-top:1px solid var(--line) }
.lp-narration p { margin:0; min-height:2.8em; display:flex; align-items:center; font-size:clamp(17px,1.45vw,21px); line-height:1.4; font-weight:520; text-wrap:pretty }
.lp-dots { display:flex; gap:6px; margin-top:4px; height:6px }
.lp-dots i { width:6px; height:6px; border-radius:99px; background:var(--line) }
.lp-dots .done { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-dots .now { width:20px; background:var(--accent) }
.lp-go { display:flex; flex-direction:column; align-items:center; gap:4px }
.lp-primary { min-width:170px; padding:15px 28px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-size:17px; font-weight:650; box-shadow:0 6px 18px rgba(20,22,27,.18) }
/* No CSS transitions on anything the timeline or the capture touches: they would run outside seek. */
.lp-primary:hover:not(:disabled) { background:#000; transform:translateY(-1px) }
.lp-primary:disabled { background:var(--faint); box-shadow:none }
.lp-keys { font-size:12px; color:var(--faint) }
.lp-ghost { background:none; border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:550; color:var(--muted) }
.lp-ghost:hover:not(:disabled) { background:color-mix(in srgb,var(--line) 70%,transparent); color:var(--ink) }
.lp-ghost:disabled { opacity:.35 }
.lp-replay { font-size:22px; padding:6px 12px }
.lp-replay[hidden] { display:block; visibility:hidden }

.lp-drawer { position:fixed; inset:0 0 0 auto; width:min(440px,92vw); background:var(--surface); box-shadow:-20px 0 60px rgba(20,22,27,.15); padding:24px 28px; overflow:auto; z-index:10; font-size:15px; line-height:1.55 }
.lp-drawer[hidden] { display:none }
.lp-drawer-head { display:flex; justify-content:space-between; align-items:center }
.lp-drawer h2 { margin:0; font-size:20px }
.lp-drawer h3 { margin:22px 0 6px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.lp-drawer ul { margin:0; padding-left:18px }
.lp-drawer li { margin:8px 0 }
.lp-drawer a { color:var(--accent-ink) }
.lp-drawer p { margin:2px 0 0; color:var(--muted) }

/* Scene building blocks. A scene uses one of them; text inside stays short. */
.sc-split { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(20px,3vw,48px); align-items:center; padding:clamp(20px,3vw,44px) }
.sc-center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:clamp(20px,3vw,44px) }
.sc-full { display:flex; padding:clamp(12px,2vw,28px) }
.sc-full > svg, .sc-visual > svg { width:100%; height:100%; display:block }
.sc-visual { min-height:0; height:100%; display:flex; align-items:center }
.sc-say { margin:0; font-size:clamp(24px,2.3vw,34px); line-height:1.22; font-weight:650; letter-spacing:-.015em; text-wrap:balance }
.sc-sub { margin:14px 0 0; font-size:clamp(16px,1.3vw,19px); line-height:1.5; color:var(--muted); text-wrap:pretty }
/* Deeper explanation: body style, comfortable measure, same place on every screen that has one. */
.sc-read { margin:16px 0 0; font-size:clamp(16px,1.25vw,18px); line-height:1.65; color:var(--ink); max-width:62ch; text-wrap:pretty }
.sc-term { display:inline-block; padding:2px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink); font-weight:650 }
.sc-big { font-size:clamp(56px,7vw,112px); line-height:1; font-weight:760; letter-spacing:-.04em; font-variant-numeric:tabular-nums }
.sc-label { font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
.sc-note { font-size:13px; color:var(--faint) }
.sc-feedback { margin:18px 0 0; padding:16px 18px; border-radius:14px; font-size:18px; line-height:1.5; background:var(--good-soft); color:#075c3f }
.sc-feedback.wrong { background:var(--bad-soft); color:#9a330a }
.lp svg text { font-family:var(--font) }
.sc-only-narrow { display:none!important }

/* Practice: the question and its answer cards form one group in the middle of the screen. */
.lp[data-kind=pratica] .lp-stage { justify-content:center }
.lp[data-kind=pratica] .lp-scene { flex:0 1 auto; min-height:260px }
.lp[data-kind=pratica] .lp-inputs { justify-content:center; margin:6px 0 24px }
.lp[data-kind=pratica] .lp-inputs .lp-label { display:none }
.lp[data-kind=pratica] .lp-choice { padding:16px 26px; font-size:19px }

/* kit.js blocks */
.sc-copy { max-width:44ch }
.sc-question { max-width:780px }
.sc-question .sc-say { font-size:clamp(26px,2.4vw,34px) }
.sc-cards { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px; padding:clamp(20px,3vw,44px); align-content:center }
.sc-card { padding:28px; border-radius:18px; background:var(--bg) }
.sc-card b { display:block; font-size:44px; margin-bottom:12px }
.sc-card p { margin:0; font-size:21px; line-height:1.35; font-weight:620 }
.sc-card span { display:block; margin-top:10px; font-size:16px; color:var(--muted) }
.mock-app { width:min(clamp(380px,40vw,600px),100%); font-size:clamp(16px,1.3vw,19px); border-radius:28px; background:var(--surface); border:1px solid var(--line); box-shadow:0 24px 60px rgba(20,22,27,.16); overflow:hidden; text-align:left }
.mock-app-bar { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); font-size:16px }
.mock-app-bar em { font-style:normal; font-size:12px; font-weight:600; color:var(--muted); padding:2px 8px; border-radius:6px; background:var(--bg) }
.mock-app-body { padding:20px 22px 24px; display:flex; flex-direction:column; gap:14px }
.app-row { display:flex; justify-content:space-between; align-items:center; padding:clamp(14px,1.4vw,20px) 18px; border-radius:14px; background:var(--bg); font-size:inherit }
.app-row b { font:650 1.2em var(--font); font-variant-numeric:tabular-nums }
.app-row.on { background:var(--accent-soft); color:var(--accent-ink) }
.app-hero { padding:6px 4px 10px }
.app-hero span { display:block; color:var(--muted) }
.app-hero b { display:block; margin-top:6px; font-size:2.4em; font-weight:720; letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.app-btn { padding:14px; border-radius:14px; background:var(--accent); color:#fff; text-align:center; font-weight:650 }
.app-toast { padding:12px 14px; border-radius:12px; background:var(--good-soft); color:#075c3f; font-weight:600 }

/* Realistic mock of a tool. Label it as a simulation inside the scene. */
/* A mock fills the scene: it is the evidence the screen is about, not a thumbnail. */
.mock { width:100%; max-width:1040px; border-radius:16px; overflow:hidden; background:#16181d; color:#e8e9ec; box-shadow:0 20px 50px rgba(20,22,27,.25); font:clamp(15px,1.35vw,20px)/1.6 var(--mono); text-align:left }
.mock-bar { display:flex; align-items:center; gap:8px; padding:12px 16px; background:#202329; font:600 13px var(--font); color:#9aa0aa }
.mock-bar i { width:12px; height:12px; border-radius:99px; background:#3a3e46 }
.mock-bar span { margin-left:10px }
.mock-bar em { margin-left:auto; font-style:normal; font-weight:500; padding:2px 8px; border-radius:6px; background:#2c3038 }
.mock pre { margin:0; padding:22px 26px; min-height:clamp(220px,38vh,420px); white-space:pre-wrap; font:inherit }
.mock .p { color:#7c8494 }
.mock .k { color:#8fb4ff }
.mock .s { color:#ffd479 }
.mock .ok { color:#5ee0a5 }
.mock .warn { color:#ff9f6e }
.mock .hl { background:rgba(255,212,121,.16); border-radius:4px; box-shadow:0 0 0 3px rgba(255,212,121,.16) }
.mock .cursor { display:inline-block; width:.6em; height:1.1em; vertical-align:-.15em; background:#e8e9ec }

@media (max-width:760px), (max-height:640px) {
  .lp { height:auto; min-height:100dvh; grid-template-rows:auto auto auto }
  .lp-course { display:none }
  .lp-scene { min-height:340px }
  .lp-bar { grid-template-columns:auto 1fr auto }
  .lp-narration { grid-column:1/-1; order:-1 }
  .lp-keys { display:none }
  .lp-primary { min-width:0 }
  .sc-split { grid-template-columns:1fr }
  .sc-only-wide { display:none!important }
  .sc-only-narrow { display:block!important }
  .sc-wide { overflow-x:auto }
  .sc-wide > svg { width:760px!important; height:auto!important; flex:none }
  .mock { font-size:13px }
}
@media (prefers-reduced-motion:reduce) { * { transition:none!important; scroll-behavior:auto!important } }

// ---------- Ajudantes de desenho ----------
// Tempo local do passo k: passos anteriores aparecem completos, posteriores ainda não existem.
const lt = (s, t, k) => s.step > k ? 1e9 : s.step === k ? t : -1;
const fade = (t, at, len = .45) => M.enter(t, at, len, 10);
const txt = (cls, x, y, size, content, extra = '') => `<text class="${cls}" x="${x}" y="${y}" font-size="${size}" ${extra}>${content}</text>`;
const node = (x, y, w, h, cls = '') => `<rect class="nd ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"/>`;
const ring = (x, y, w, h, t, at) => { const v = M.pulse(t, at, .6); return v > .01 ? `<rect x="${x - 8 * v}" y="${y - 8 * v}" width="${w + 16 * v}" height="${h + 16 * v}" rx="${18 + 6 * v}" fill="none" stroke="var(--warm)" stroke-width="3" opacity="${(1 - .4 * v).toFixed(2)}"/>` : ''; };
const dot = (a, b, u) => { if (u <= 0 || u >= 1) return ''; const e = M.easeInOutCubic(u); return `<circle cx="${M.lerp(a.x, b.x, e).toFixed(1)}" cy="${M.lerp(a.y, b.y, e).toFixed(1)}" r="13" fill="var(--warm)" stroke="#fff" stroke-width="3"/>`; };
// Dois desenhos do mesmo estado: largo (desktop) e alto (celular). O CSS mostra um deles.
const dual = (build, W, T) => K.diagram(build(W), { w: W.w, h: W.h, narrow: { body: build(T), w: T.w, h: T.h } });

// Código com cores simples: strings em amarelo, palavras-chave em azul, comentários apagados.
function hlCode(line) {
  if (/^\s*\/\//.test(line)) return `<span class="c">${esc(line)}</span>`;
  return line.split(/('[^']*'|`[^`]*`)/).map((part, i) => i % 2 ? `<span class="s">${esc(part)}</span>`
    : esc(part).replace(/\b(const|if|return|function)\b/g, '<span class="k">$1</span>')).join('');
}
// Painel de código real do projeto. `lit` = linhas acesas neste passo; as outras ficam apagadas.
function codePanel(lines, lit, { title = 'server.js', badge = 'código do projeto' } = {}) {
  const body = lines.map((l, i) => `<span class="ln ${lit && !lit.includes(i) ? 'dim' : ''} ${lit && lit.includes(i) ? 'hl' : ''}">${hlCode(l) || ' '}</span>`).join('');
  return `<div class="sc-center"><div class="mock code" data-qa-mock="código" data-qa-text="codigo"><div class="mock-bar"><i></i><i></i><i></i><span>${esc(title)}</span><em>${esc(badge)}</em></div><pre>${body}</pre></div></div>`;
}

// ---------- 9 · Mecanismo: o fluxo completo do Salvar ----------
const FLUXO = ['Página', 'Express', 'validarFilme', 'Banco'];
const fluxo = {
  id: 'fluxo', kind: 'diagrama', kicker: 'O mecanismo', title: 'O caminho do Salvar, etapa por etapa', sources: ['express', 'expressjson', 'bsqlite'],
  steps: [{ id: 'clique', label: '', duration: 1.2 }, { id: 'rota', label: '', duration: 1.5 }, { id: 'json', label: '', duration: .8 },
    { id: 'validar', label: '', duration: 1.5 }, { id: 'banco', label: '', duration: 1.5 }, { id: 'resposta', label: '', duration: 1.8 }, { id: 'card', label: '', duration: .8 }],
  render({ state, time }) {
    const k = state.step, active = [0, 1, 1, 2, 3, 0, 0][k];
    // Notas que ficam como rastro embaixo de cada peça.
    const NOTES = [{ at: 0, node: 0, text: 'fetch envia' }, { at: 1, node: 1, text: 'rota POST /filmes' }, { at: 2, node: 1, text: 'req.body pronto' },
      { at: 3, node: 2, text: 'nenhum erro' }, { at: 4, node: 3, text: 'INSERT → id 1' }, { at: 5, node: 0, text: '201 + JSON' }, { at: 6, node: 0, text: 'card desenhado' }];
    const build = L => {
      const P = i => L.pos(i);
      let s = '';
      // Ida: arestas entre as peças. Volta: caminho tracejado do banco até a página.
      for (let i = 0; i < 3; i++) { const a = P(i), b = P(i + 1); s += `<path d="${L.edge(a, b)}" class="ed ${k >= 1 && k <= 4 && active === i + 1 ? 'on' : ''}"/>`; }
      s += `<path d="${L.back}" class="ed back ${k === 5 ? 'on' : ''}" opacity="${k >= 5 ? 1 : .35}"/>`;
      FLUXO.forEach((name, i) => {
        const p = P(i), e = fade(lt(state, time, 0), .1 + i * .12), on = active === i && k !== 6 || (k === 6 && i === 0);
        s += `<g ${K.rise(e)}>${node(p.x - L.bw / 2, p.y - L.bh / 2, L.bw, L.bh, on ? 'on' : '')}${txt('tt mid', p.x, p.y, L.fs, name, `data-qa-text="n${i}"`)}</g>`;
      });
      // Rastro: a última nota de cada peça (até o passo atual).
      FLUXO.forEach((_, i) => {
        const mine = NOTES.filter(n => n.node === i && n.at <= k), last = mine[mine.length - 1];
        if (!last) return;
        // A nota entra quando a mensagem chega (e termina antes do fim do passo).
        const e = fade(lt(state, time, last.at), [.6, 1.0, .2, 1.0, 1.0, 1.3, .2][last.at]), p = L.note(i);
        s += `<text class="${last.at === k ? 'wm' : 'ac'} ${L.anchor}" x="${p.x}" y="${p.y + e.y}" font-size="${L.ls}" opacity="${e.opacity.toFixed(3)}" data-qa-text="nota${i}">${last.text}</text>`;
      });
      // A mensagem em trânsito (posição = função do tempo local).
      const go = (i, j, at, len) => dot(L.port(i, 'out'), L.port(j, 'in'), M.segment(time, at, at + len));
      if (k === 1) s += go(0, 1, .1, 1.0);
      if (k === 3) s += go(1, 2, .1, 1.0);
      if (k === 4) s += go(2, 3, .1, 1.0);
      if (k === 5) { const u = M.segment(time, .1, 1.3); if (u > 0 && u < 1) { const q = L.backAt(M.easeInOutCubic(u)); s += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="13" fill="var(--warm)" stroke="#fff" stroke-width="3"/>`; } }
      const cnt = `etapa ${Math.min(k, 6)} de 6`;
      s += txt('lb', L.cx, L.cy, L.ls, k === 0 ? 'início' : cnt, `data-qa-text="contador" ${L.narrow ? 'text-anchor="end"' : ''}`);
      return s;
    };
    const W = {
      w: 1100, h: 360, bw: 220, bh: 100, fs: 28, ls: 24, anchor: 'mid', cx: 0, cy: 345,
      pos: i => ({ x: 120 + i * 286, y: 90 }), note: i => ({ x: 120 + i * 286, y: 172 }),
      port: (i, side) => ({ x: 120 + i * 286 + (side === 'out' ? 110 : -110), y: 90 }),
      edge: (a, b) => `M${a.x + 110} ${a.y} H${b.x - 110}`,
      back: 'M978 200 V260 Q978 285 953 285 H145 Q120 285 120 260 V205',
      backAt: u => ({ x: M.lerp(978, 120, u), y: 285 })
    };
    const T = {
      w: 420, h: 600, bw: 210, bh: 84, fs: 26, ls: 20, anchor: '', cx: 410, cy: 582, narrow: true,
      pos: i => ({ x: 125, y: 52 + i * 150 }), note: i => ({ x: 240, y: 52 + i * 150 }),
      port: (i, side) => ({ x: 125, y: 52 + i * 150 + (side === 'out' ? 42 : -42) }),
      edge: (a, b) => `M${a.x} ${a.y + 42} V${b.y - 42}`,
      back: 'M20 502 V52',
      backAt: u => ({ x: 20, y: M.lerp(502, 52, u) })
    };
    const caption = ['Você clica em Salvar. O JavaScript da página monta o JSON e o envia com fetch, a função que faz pedidos sem recarregar.',
      'O pedido chega ao Express, que encontra a rota POST /filmes.',
      'Antes da função, o express.json() lê o texto JSON e o transforma no objeto req.body.',
      'validarFilme confere cada campo de req.body. Duna passa em todas as regras: nenhum erro.',
      'O INSERT grava a linha no filmes.db, e o banco devolve o id novo: 1.',
      'O servidor responde 201 com o filme em JSON. A resposta volta até a página.',
      'O JavaScript da página lê o JSON e desenha o card. Foram 6 etapas, e a página não recarregou.'][k];
    return { html: dual(build, W, T), caption };
  }
};

const REGRAS = [
  { campo: 'titulo', regra: 'texto de 2 a 100 caracteres', ok: i => i.titulo.length >= 2 },
  { campo: 'genero', regra: 'um gênero da lista', ok: () => true },
  { campo: 'duracao', regra: 'inteiro de 1 a 300', ok: i => i.duracao >= 1 && i.duracao <= 300 },
  { campo: 'classificacao', regra: 'L, 10, 12, 14, 16 ou 18', ok: () => true },
  { campo: 'sinopse', regra: 'opcional, até 500', ok: () => true }
];
const MSG = { titulo: 'O título deve ter de 2 a 100 caracteres.', duracao: CASE.erroDuracao };
const validar = {
  id: 'validar', kind: 'diagrama', kicker: 'O mecanismo', title: 'validarFilme confere as regras em ordem', sources: ['execucao'],
  initialInputs: { titulo: 'Duna', duracao: 0 },
  controls: [{ key: 'titulo', type: 'choice', label: 'título', options: [{ value: 'Duna', label: '"Duna"' }, { value: 'D', label: '"D"' }] },
    { key: 'duracao', type: 'range', label: 'duração', min: 0, max: 320, step: 1, format: v => `${v} min` }],
  auditCases: [{ id: 'valido', inputs: { titulo: 'Duna', duracao: 155 } }, { id: 'titulo', inputs: { titulo: 'D', duracao: 0 } }, { id: 'acima', inputs: { titulo: 'Duna', duracao: 320 } }],
  steps: [{ id: 'regras', label: '', duration: 1 }, { id: 'conferir', label: '', duration: 2.6 }, { id: 'resposta', label: '', duration: .7 }],
  render({ state, time }) {
    const inp = state.inputs, k = state.step;
    // Modelo: índice da primeira regra que falha (ou -1).
    const fail = REGRAS.findIndex(r => !r.ok(inp)), stop = fail === -1 ? REGRAS.length - 1 : fail;
    const checked = k === 0 ? -1 : k === 1 ? Math.min(stop, Math.floor(M.segment(time, .2, 2.4, M.linear) * (stop + 1)) - 1) : stop;
    const erro = fail === -1 ? null : MSG[REGRAS[fail].campo];
    const build = L => {
      let s = '';
      REGRAS.forEach((r, i) => {
        const y = i * L.gap, e = fade(lt(state, time, 0), .05 + i * .1), done = i <= checked, bad = done && i === fail, skipped = k >= 1 && i > stop && checked >= stop;
        const cur = k === 1 && i === checked + 1 && i <= stop;
        s += `<g ${K.rise(e)} opacity="${skipped ? .35 : 1}"><rect class="row ${cur ? 'on' : ''}" x="0" y="${y}" width="${L.w}" height="${L.gap - 12}" rx="14"/>
          ${txt('ac mono', 20, y + L.ty, L.fs, r.campo, `data-qa-text="campo${i}"`)}${txt('lb', L.rx, y + L.ry, L.fs, r.regra)}
          ${done ? txt(bad ? 'no mid' : 'ok mid', L.w - 40, y + L.ty, 30, bad ? '✗' : '✓', `data-qa-text="marca${i}"`) : skipped ? txt('lb', L.w - 20, y + L.ty, L.fs - 2, 'não conferida', 'text-anchor="end"') : ''}</g>`;
      });
      const res = fade(lt(state, time, 2), .05), y = REGRAS.length * L.gap + 6;
      s += `<g ${K.rise(res)}><rect x="0" y="${y}" width="${L.w}" height="${L.resH}" rx="14" fill="${erro ? 'var(--bad-soft)' : 'var(--good-soft)'}"/>
        ${txt(erro ? 'no mono' : 'ok mono', 20, y + 34, L.fs + 2, erro ? '400 Bad Request' : '201 Created', 'data-qa-text="status"')}
        ${txt('lb', 20, y + 76, L.fs - 2, erro ? esc(L.short ? erro.replace('A duração deve ser um número inteiro de', 'duração: inteiro de') : erro) : 'nenhum erro: segue para o INSERT', 'data-qa-text="erro"')}</g>`;
      return s;
    };
    const W = { w: 1000, h: 5 * 78 + 6 + 104, gap: 78, ty: 33, ry: 33, rx: 260, fs: 24, resH: 104 };
    const T = { w: 420, h: 5 * 92 + 6 + 104, gap: 92, ty: 28, ry: 62, rx: 20, fs: 20, resH: 104, short: true };
    const nome = `título "${inp.titulo}", duração ${inp.duracao}`;
    const caption = k === 0 ? `Escolha um título e uma duração. O corpo agora tem ${nome}.`
      : k === 1 ? 'validarFilme confere uma regra por vez, de cima para baixo.'
      : erro ? `A regra de ${REGRAS[fail].campo} falhou. validarFilme para no primeiro problema e devolve só essa mensagem; a rota responde 400.`
      : 'Todas as regras passaram: validarFilme devolve null, e a rota segue para o INSERT e responde 201.';
    return { html: dual(build, W, T), caption };
  }
};

// ---------- 15 · Mecanismo: :id, changes e 404 ----------
const naoExiste = {

  question: 'O banco tem só os filmes 1 e 2. Chega PUT /filmes/9 com um corpo válido. Qual status volta?',
  hint: 'O corpo passa na validação. O que o UPDATE encontra com id 9?',
  correct: '404', options: [{ value: '404', label: '404 Not Found' }, { value: '400', label: '400 Bad Request' }, { value: '200', label: '200 OK' }],
  feedback: {
    '404': 'Isso. O corpo passa na validação, mas o UPDATE … WHERE id = 9 não encontra linha: info.changes vale 0, e a rota responde 404.',
    '400': '400 é para dados inválidos, e este corpo é válido. O problema está no id: o UPDATE não acha a linha 9, changes vale 0, e a resposta é 404.',
    '200': 'A rota só responde 200 quando o UPDATE muda uma linha. Com id 9 nenhuma linha muda: changes vale 0, então volta 404.'
  }
});

// ---------- 18 · Os ? do SQL ----------
const interrog = {
  id: 'interrog', kind: 'explicar', kicker: 'Segurança', title: 'Por que o SQL usa ? em vez de juntar texto', sources: ['owasp', 'bsqlite'],
  steps: [{ id: 'perigo', label: '', duration: 1.3 }, { id: 'seguro', label: '', duration: 1.3 }],
  render({ state, time }) {
    const a = fade(lt(state, time, 0), .1), b = fade(lt(state, time, 1), .1), k = state.step;
    // Texto neutro em tinta; só a linha do efeito leva a cor de erro ou de acerto.
    const visual = `<svg viewBox="0 0 540 456" role="img">
      ${txt('tt', 0, 18, 22, 'alguém chama: DELETE /filmes/1 OR 1=1', 'data-qa-text="ataque"')}
      <g ${K.rise(a)}><rect x="0" y="44" width="540" height="190" rx="16" fill="var(--bad-soft)" opacity="${k === 0 ? 1 : .55}"/>
        ${txt('tt mono', 18, 82, 21, '"... WHERE id = " + req.params.id', 'data-qa-text="ruim"')}
        ${txt('tt mono', 18, 122, 21, 'vira: DELETE FROM filmes')}${txt('tt mono', 94, 156, 21, 'WHERE id = 1 OR 1=1')}
        ${txt('no', 18, 204, 22, '✗ 1=1 é sempre verdade: apaga tudo', 'data-qa-text="ruim-efeito"')}</g>
      <g ${K.rise(b)}><rect x="0" y="256" width="540" height="196" rx="16" fill="var(--good-soft)"/>
        ${txt('tt mono', 18, 294, 21, "prepare('... WHERE id = ?')", 'data-qa-text="bom"')}${txt('tt mono', 44, 328, 21, '.run(req.params.id)')}
        ${txt('tt', 18, 370, 21, 'procura o id "1 OR 1=1", como texto')}
        ${txt('ok', 18, 418, 22, '✓ nenhuma linha tem esse id: 404', 'data-qa-text="bom-efeito"')}</g>
    </svg>`;
    const say = 'Com <span class="sc-term">?</span>, o valor vai separado do comando e nunca vira SQL.';
    const caption = k === 0 ? 'Se o id for colado no texto do comando, quem chama a rota consegue escrever SQL: aqui, um pedido apagaria a tabela inteira.'
      : 'Com ?, o better-sqlite3 entrega o valor à parte. "1 OR 1=1" vira só um id que não existe.';
    return { html: K.split({ say, visual }), caption };
  }
};

// ---------- 19 · Prova real: persistência ----------
const reiniciar = {
  id: 'reiniciar', kind: 'mock', kicker: 'Prova real', title: 'Desligar o servidor não apaga os filmes', sources: ['execucao', 'bsqlite'],
  steps: [{ id: 'desligar', label: '', duration: 1.8 }, { id: 'religar', label: '', duration: 1.3 }, { id: 'listar', label: '', duration: 1.6 }],
  render({ state, time }) {
    const script = [
      [{ type: true, text: 'node server.js', at: .2, cps: 26 }, { text: 'Servidor em http://localhost:3000', at: .9, cls: 'ok' }, { text: '^C', at: 1.4, cls: 'warn' }],
      [{ type: true, text: 'node server.js', at: .1, cps: 26 }, { text: 'Servidor em http://localhost:3000', at: .8, cls: 'ok' }],
      [{ text: '', at: 0 }, { type: true, prompt: '$ ', text: 'curl localhost:3000/filmes', at: .1, cps: 30 }, { text: `[${CASE.saved}]`, at: 1.1, cls: 's', hl: 1.25 }]
    ];
    const caption = ['O servidor é desligado com Ctrl+C. Tudo o que estava na memória do programa se perde.',
      'Ao religar, o db.js abre o mesmo filmes.db. O CREATE TABLE IF NOT EXISTS só cria a tabela se ela ainda não existir.',
      'A lista volta com Duna: o filme estava no arquivo, não na memória. É isso que você mostra ao professor recarregando a página.'][state.step];
    return { html: K.terminal(state, time, script, { title: 'terminal', badge: 'saída real' }), caption };
  }
};

// ---------- 20 · Prática: diagnosticar ----------
const diagnosticar = K.quiz({
  id: 'diagnosticar', kicker: 'Sua vez · diagnosticar', title: 'Um return esquecido', sources: ['execucao'],
  question: 'Um colega tirou o return da linha que responde 400. Chega um POST com o título "D". O que acontece?',
  hint: 'Sem return, a função não para depois de responder. A próxima linha é o INSERT.',
  correct: 'salva', options: [{ value: 'salva', label: '400, mas grava "D"' }, { value: 'para', label: '400 e não grava nada' }, { value: '201', label: '201 e grava "D"' }],
  feedback: {
    'salva': 'Isso, e foi o que aconteceu ao testar: a resposta 400 sai, mas a função continua, o INSERT grava "D", e o res.status(201) quebra com ERR_HTTP_HEADERS_SENT.',
    'para': 'Esse é o comportamento com o return. Sem ele, a função segue depois do 400: o INSERT grava "D" e o segundo envio quebra com ERR_HTTP_HEADERS_SENT.',
    '201': 'Quem recebe a resposta vê 400, porque ela sai primeiro e cada pedido tem uma resposta só. O problema é que, depois dela, o INSERT ainda grava "D".'
  }
});
