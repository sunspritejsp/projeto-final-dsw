<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMais - Membros do Clube</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Página da equipe: fica fora do menu; chega-se a ela pelo link no club.html -->
  <header class="site-header">
    <nav class="container nav">
      <a href="index.html" class="logo">Cine<span>Mais</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Início</a></li>
        <li><a href="movies.html" class="nav-link">Em Cartaz</a></li>
        <li><a href="about.html" class="nav-link">Sobre</a></li>
        <li><a href="club.html" class="nav-link">Clube</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="section-title">Membros do Clube</h1>
    <p class="text">Área da equipe: consulte, edite ou remova as inscrições. Para uma nova inscrição, use a página <a href="club.html">Clube</a>.</p>

    <div class="search-bar">
      <input type="search" id="search" placeholder="Buscar por nome..." aria-label="Buscar por nome">
      <label class="option" for="filter-student">
        <input type="checkbox" id="filter-student">
        Só estudantes
      </label>
    </div>

    <!-- Carregando, lista vazia, erro e sucesso aparecem aqui (role="status" faz o leitor de tela anunciar) -->
    <p id="status-message" class="message" role="status">Carregando membros...</p>

    <!-- O members.js cria um <article class="card"> por membro aqui dentro, com os botões Editar e Excluir -->
    <div id="member-list" class="grid"></div>
  </main>

  <footer class="site-footer">
    <address>Contato: (82) 4022-8922</address>
    <p>&copy; 2026 CineMais - Projeto Integrador de Desenvolvimento Web.</p>
  </footer>
</body>
</html>
