<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMais - Filmes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a href="index.html" class="logo">Cine<span>Mais</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Início</a></li>
        <li><a href="movies.html" class="nav-link active">Filmes</a></li>
        <li><a href="contact.html" class="nav-link">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="section-title">Filmes</h1>
    <p class="text">Cadastre, edite e remova os filmes da programação. <a href="#movie-list-title">Ir para a lista</a>.</p>

    <!-- Formulário usado para cadastrar e também para editar -->
    <section>
      <h2 id="form-title" class="section-title">Cadastrar filme</h2>
      <form id="movie-form" class="form">
        <!-- Guarda o id do filme em edição; vazio = cadastro novo -->
        <input type="hidden" id="movie-id">

        <label class="field" for="title">
          Título
          <input type="text" id="title" name="title" required minlength="2" maxlength="100">
        </label>

        <label class="field" for="genre">
          Gênero
          <select id="genre" name="genre" required>
            <option value="">Selecione...</option>
            <option>Ação</option>
            <option>Animação</option>
            <option>Comédia</option>
            <option>Drama</option>
            <option>Ficção Científica</option>
            <option>Musical</option>
            <option>Romance</option>
            <option>Terror</option>
          </select>
        </label>

        <label class="field" for="duration">
          Duração (minutos)
          <input type="number" id="duration" name="duration" required min="1" max="300" step="1">
        </label>

        <!-- Basta um radio com required para o grupo todo ser obrigatório -->
        <fieldset class="options">
          <legend>Classificação</legend>
          <label class="option" for="rating-l"><input type="radio" id="rating-l" name="rating" value="L" required> L</label>
          <label class="option" for="rating-10"><input type="radio" id="rating-10" name="rating" value="10"> 10</label>
          <label class="option" for="rating-12"><input type="radio" id="rating-12" name="rating" value="12"> 12</label>
          <label class="option" for="rating-14"><input type="radio" id="rating-14" name="rating" value="14"> 14</label>
          <label class="option" for="rating-16"><input type="radio" id="rating-16" name="rating" value="16"> 16</label>
          <label class="option" for="rating-18"><input type="radio" id="rating-18" name="rating" value="18"> 18</label>
        </fieldset>

        <label class="field" for="release-date">
          Data de estreia (opcional)
          <input type="date" id="release-date" name="release_date">
        </label>

        <label class="option" for="now-showing">
          <input type="checkbox" id="now-showing" name="now_showing">
          Em cartaz
        </label>

        <label class="field" for="synopsis">
          Sinopse (opcional)
          <textarea id="synopsis" name="synopsis" rows="4" maxlength="500"></textarea>
        </label>

        <div class="card-actions">
          <button type="submit" id="submit-button" class="button">Salvar</button>
          <button type="button" id="cancel-button" class="button button-secondary hidden">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section>
      <h2 id="movie-list-title" class="section-title">Filmes cadastrados</h2>

      <div class="search-bar">
        <input type="search" id="search" placeholder="Buscar por título..." aria-label="Buscar por título">
        <label class="option" for="filter-showing">
          <input type="checkbox" id="filter-showing">
          Só em cartaz
        </label>
      </div>

      <!-- Carregando, lista vazia, erro e sucesso aparecem aqui (role="status" faz o leitor de tela anunciar) -->
      <p id="status-message" class="message" role="status">Carregando filmes...</p>

      <!-- O movies.js cria um <article class="card"> por filme aqui dentro -->
      <div id="movie-list" class="grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CineMais - Projeto Integrador de Desenvolvimento Web.</p>
  </footer>
</body>
</html>
